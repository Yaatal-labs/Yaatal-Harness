[package]
name = "yaatal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, models, AI router, and business logic for Yaatal Engine"

[lints]
workspace = true

[features]
## Enable the Cloudflare R2 edge store backend.
## Does not pull in aws-sdk-s3 yet — that's a follow-up lane when the R2
## client is ready to be wired.
r2 = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
libsql.workspace = true
sea-orm.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
serde_yaml = "0.9"

[dev-dependencies]
pretty_assertions.workspace = true
mockall.workspace = true
tokio = { workspace = true, features = ["test-util"] }

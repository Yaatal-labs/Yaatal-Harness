[package]
name = "yaatal-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice recording, encoding, and transcription for Yaatal Engine"

[lints]
workspace = true

[features]
default = []
# Enable native audio capture via cpal (useful only for standalone hardware/kiosks, not mobile/PWA)
edge = ["dep:cpal"]

[dependencies]
yaatal-core = { path = "../yaatal-core" }
cpal = { version = "0.15", optional = true }
hound = "3.5"
bytes = "1.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
thiserror = "2"

[dev-dependencies]
pretty_assertions.workspace = true

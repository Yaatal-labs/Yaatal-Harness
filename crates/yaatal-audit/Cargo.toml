[package]
name = "yaatal-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
yaatal-core = { path = "../yaatal-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# local-shell: this crate's test exercises ToolAuditObserver against a real dangerous
# built-in (shell) to prove audit events are written; it is not part of the default
# yaatal-tools surface (see that crate's compile-time dangerous-tool gates).
yaatal-tools = { path = "../yaatal-tools", features = ["local-shell"] }

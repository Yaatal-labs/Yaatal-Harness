[package]
name = "yaatal-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice pipeline for Yaatal Engine — speech-core C ABI facade + WebSocket transport"

[lints]
workspace = true

[features]
default = []

# Gate the cmake/bindgen C++ build behind this feature.
# Disable for `--no-default-features` so CI / docs can `cargo check` without
# cmake or ALSA/ONNX system deps installed.
speech-core-sys = ["dep:bindgen", "dep:cmake"]

# Build the ONNX-backed reference models (Silero VAD, Parakeet STT, Kokoro TTS,
# DeepFilterNet3) and link libspeech_core_models.a + system onnxruntime.
# Requires: -DORT_DIR=<onnxruntime-root> / libonnxruntime on LD_LIBRARY_PATH.
models = ["speech-core-sys"]

# Native audio capture via cpal — only for standalone hardware/kiosks, not
# mobile/PWA. Server builds (raw WS PCM input) leave this off.
edge = ["dep:cpal"]

# Restore the old cpal+HF-Whisper transcription path for emergency revert.
legacy-cpal-whisper = ["edge"]

[dependencies]
yaatal-core = { path = "../yaatal-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
thiserror = "2"
bytes = "1.5"
hound = "3.5"
cpal = { version = "0.15", optional = true }

[build-dependencies]
# Native speech-core build dependencies are pulled only when
# `speech-core-sys` is enabled.
cmake = { version = "0.1", optional = true }
bindgen = { version = "0.69", optional = true }

[dev-dependencies]
pretty_assertions.workspace = true

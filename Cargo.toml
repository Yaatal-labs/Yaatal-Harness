##
## Root cargo workspace for the Yaatal AI Harness prototype.
##

[workspace]
resolver = "2"
members = [
    "crates/yaatal-core",
    "crates/yaatal-search",
    "crates/yaatal-feed",
    "crates/yaatal-voice",
    "crates/yaatal-models",
    "crates/yaatal-policy",
    "crates/yaatal-evals",
    "crates/yaatal-observability",
    "crates/yaatal-tools",
    "crates/yaatal-memory",
    "crates/yaatal-audit",
    "crates/yaatal-runner",
    "crates/yaatal-edge-turn",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yaatal-labs/Yaatal-Harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
async-trait = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
pin-project = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
large_futures = "warn"

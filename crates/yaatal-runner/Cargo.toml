[package]
name = "yaatal-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yaatal-ops-runner"
path = "src/main.rs"

[[bin]]
name = "yaatal-proposals-push"
path = "src/bin/proposals_push.rs"

[dependencies]
yaatal-core = { path = "../yaatal-core" }
yaatal-audit = { path = "../yaatal-audit" }
yaatal-policy = { path = "../yaatal-policy" }
yaatal-tools = { path = "../yaatal-tools" }
yaatal-evals = { path = "../yaatal-evals" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

[features]
# Build with `--features postgres` to let the runner use PgAuditStore when
# AUDIT_PG_URL / DATABASE_URL is set (else it stays on the JSONL default).
postgres = ["yaatal-audit/postgres"]

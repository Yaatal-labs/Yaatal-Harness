# Production configuration for Railway / hosted deployments

logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json

server:
  port: {{ get_env(name="PORT", default="8080") }}
  binding: 0.0.0.0
  host: {{ get_env(name="APP_URL", default="http://localhost:8080") }}
  middlewares:
    cors:
      enable: true
      allow_origins:
        - "*"
      allow_headers:
        - Content-Type
        - Authorization
      allow_methods:
        - GET
        - POST
        - PUT
        - OPTIONS
      max_age: 3600

workers:
  mode: BackgroundAsync

mailer:
  stub: {{ get_env(name="MAILER_STUB", default="true") }}
  smtp:
    enable: {{ get_env(name="SMTP_ENABLE", default="false") }}
    host: {{ get_env(name="SMTP_HOST", default="localhost") }}
    port: {{ get_env(name="SMTP_PORT", default="1025") }}
    secure: {{ get_env(name="SMTP_SECURE", default="false") }}

database:
  uri: {{ get_env(name="DATABASE_URL") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="5000") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="5") }}
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: {{ get_env(name="JWT_SECRET") }}
    expiration: {{ get_env(name="JWT_EXPIRATION_SECONDS", default="259200") }}
    location:
      - from: Bearer
      - from: Cookie
        name: yaatal_token

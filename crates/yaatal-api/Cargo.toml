[package]
name = "yaatal-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "yaatal_api-cli"
description = "Loco-based HTTP backend for Yaatal Engine"

[lints]
workspace = true

[dependencies]
yaatal-core = { path = "../yaatal-core" }
yaatal-feed = { path = "../yaatal-feed" }
yaatal-voice = { path = "../yaatal-voice" }
loco-rs = { version = "0.16" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
axum = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.11"
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = "0.4"
validator = "0.20"
uuid = { version = "1.6", features = ["v4"] }
include_dir = "0.7"

[[bin]]
name = "yaatal_api-cli"
path = "src/bin/main.rs"
required-features = []

[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { version = "0.16", features = ["testing"] }
serial_test = "3.1.1"
rstest = "0.25"
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
pretty_assertions = { workspace = true }

[package]
name = "yaatal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, models, AI router, and business logic for Yaatal Engine"

[lints]
workspace = true

[features]
## Enable the Cloudflare R2 edge store backend.
## Does not pull in aws-sdk-s3 yet — that's a follow-up lane when the R2
## client is ready to be wired.
r2 = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
tracing.workspace = true
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
serde_yaml = "0.9"
yaatal-payments = { path = "../yaatal-payments" }

[dev-dependencies]
pretty_assertions.workspace = true
mockall.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Re-add the sqlx-sqlite driver for in-memory schema unit tests
# (tests/e2_schema_relations.rs uses `sqlite::memory:`). Production
# runtime stays Postgres-only — this feature is dev-only.
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }

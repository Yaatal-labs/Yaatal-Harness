[workspace]
resolver = "2"
members = [
    "crates/yaatal-core",
    "crates/yaatal-api",
    "crates/yaatal-feed",
    "crates/yaatal-voice",
    "crates/yaatal-search",
    "apps/yokk-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yaatal-labs/yaatal-engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
libsql = "0.6"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
pretty_assertions = "1"
mockall = "0.13"
loco-rs = { version = "0.16" }

[workspace.lints.clippy]
# Correctness — deny outright
correctness = { level = "deny", priority = -1 }
# Suspicious patterns
suspicious = { level = "warn", priority = -1 }
# Complexity
complexity = { level = "warn", priority = -1 }
# Style — enforce consistency
style = { level = "warn", priority = -1 }
# Performance suggestions
perf = { level = "warn", priority = -1 }
# Individual rules
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
large_futures = "warn"